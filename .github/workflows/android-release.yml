name: Android Signed Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build, Test & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Decode Release Keystore & Properties
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Missing required signing secrets (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD)."
            exit 1
          fi
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 --decode > keystore/toeic_release.jks
          cat <<EOF > keystore.properties
          storeFile=keystore/toeic_release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build Signed Minified Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare Versioned APK Artifact
        shell: bash
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-manual}"
          cp app/build/outputs/apk/release/app-release.apk "TOEIC-Flashcard-${TAG_NAME}.apk"
          sha256sum "TOEIC-Flashcard-${TAG_NAME}.apk" > checksums-sha256.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            TOEIC-Flashcard-${{ github.ref_name }}.apk
            checksums-sha256.txt
          generate_release_notes: true

      - name: Cleanup Sensitive Signing Files
        if: always()
        run: rm -rf keystore keystore.properties
